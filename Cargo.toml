[workspace]
members = ["core", "server", "client"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"
repository = "https://github.com/rry-web/anathemic"

[workspace.dependencies]
anathemic-core = { path = "core" }
anathemic-client = { path = "client" }
anyhow = "1"
ciborium = "0.2"
clap = { version = "4", features = ["derive"] }
ed25519-dalek = { version = "2", features = ["rand_core"] }
hex = "0.4"
rand = "0.8"
serde = { version = "1", features = ["derive"] }
serde_bytes = "0.11"
sha2 = "0.10"
thiserror = "2"
zstd = "0.13"
